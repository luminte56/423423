services:
  - type: web
    name: loader-telegram-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: loader-db
          property: connectionString
      - key: PASSWORD_SALT
        generateValue: true

databases:
  - name: loader-db
    plan: free
